name: Casir+ Deploy to Easypanel

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy to Easypanel
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Easypanel Deploy Webhook
        env:
          DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "Secret EASYPANEL_DEPLOY_URL belum diset"
            exit 1
          fi
          curl -fsS -X POST "$DEPLOY_URL" --max-time 60
          echo "Deploy berhasil dipicu ke Easypanel!"
