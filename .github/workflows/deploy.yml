name: Casir+ CI/CD to Easypanel

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: casir-cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Validate Prisma and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Nilai khusus build CI; tidak mengakses database production.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/casir_ci
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-build-only-placeholder-not-for-production-2026
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Samakan dengan versi Node.js pada Dockerfile.
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build and check TypeScript
        run: npm run build

  deploy:
    name: Deploy to Easypanel
    needs: ci
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Easypanel Deploy Webhook
        env:
          DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "Secret EASYPANEL_DEPLOY_URL belum diset"
            exit 1
          fi
          curl -fsS -X POST "$DEPLOY_URL" --connect-timeout 15 --max-time 60 --output /dev/null
          echo "Deploy berhasil dipicu. Cek hasil build dan deploy di Easypanel."
